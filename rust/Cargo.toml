# Rust core of the matching engine: the hot loops, called from Python (D16).
[workspace]
members = ["lastfirstdate-core", "lastfirstdate-py"]
resolver = "3"

[workspace.package]
version = "0.14.0"  # the same as pyproject.toml
edition = "2024"
rust-version = "1.85"
publish = false

[profile.release]
codegen-units = 1
lto = "thin"
