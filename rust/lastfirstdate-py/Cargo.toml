[package]
name = "lastfirstdate-py"
version.workspace = true
description = "Python bindings (PyO3) for lastfirstdate-core, imported as lastfirstdate._core."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
lastfirstdate-core = { path = "../lastfirstdate-core" }
numpy = "=0.30.0"
pyo3 = "=0.30.1"
