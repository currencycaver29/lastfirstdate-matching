[population]                  # Synthetic member generator (FR-LM-03)
n_members = 400
share_men = 0.25              # 100 men, 300 women (3:1)
orientation = { straight = 1.0, gay = 0.0, bi = 0.0 }
paying_share = { man = 1.0, woman = 0.0 }
verified_share = 1.0          # everyone passes ID, liveness and face match to join
active_share = 0.95            # a fresh beta: nearly everyone active
age_min = 21
age_max = 45
max_km_min = 5.0
max_km_max = 25.0
embedding_dim = 128           # stand-in for a real image model's output size
n_look_types = 8              # clusters in the fake photo embeddings
n_audit_groups = 5            # fake demographic labels, used only for fairness audits
interests_min = 5
interests_max = 10
slots_min = 4
slots_max = 10
dealbreaker_rate = 0.12       # chance a member marks a values question as a dealbreaker
area_jitter_deg = 0.012       # spread of homes around each area center (about 1.2 km)
prompt_style = "prompts"         # "bio" (short bio) or "prompts" (the app's free-text prompts)
exact_counts = true                  # exactly share_men x n men, instead of random draws

# The app's intent questions: one answer each, options in order, compatibility from
# closeness. "Want them" with "Not for me" rules a pair out.
[[values]]
key = "commitment_timeline"
options = ["Now", "Within a year", "No timeline"]
mode = "closeness"

[[values]]
key = "exclusivity"
options = ["Yes", "Open to discuss", "Not yet"]
mode = "closeness"

[[values]]
key = "kids"
options = ["Want them", "Open to it", "Not for me"]
mode = "closeness"
incompatible = [["Want them", "Not for me"]]

# Phase 1 is one dense NYC zone.
[[population.areas]]
name = "Phase 1 zone"
lat = 40.730
lon = -73.995
share = 1.0
