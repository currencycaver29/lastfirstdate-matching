# lastfirstdate's real rules for the Phase 1 beta, from the website (4 Nov 2026):
# one NYC zone, 100 paying men, 300 committed women, man-woman only, every man pays
# $200/month for 3 guaranteed dates, women join free, nobody over 3 dates a cycle,
# 30-photo calibration, single-answer intent questions, free-text prompts.
# Load with: config.load("config/phase1.toml")
#
# lastfirstdate matching engine settings.
# Every weight, cap and threshold lives here so it can change without touching code.
# Section names match the stages in docs/SPEC.md.

[filter]                      # Stage 1: hard filter
require_verified = true
active_within_days = 14       # profile must have been active in the last N days
min_shared_slots = 1          # free weekly time slots both people share

[personality]                 # Stage 4: P = w_text * t + w_values * A + w_big5 * p
w_text = 0.55                 # free-text prompts
w_values = 0.45               # the intent questions
w_big5 = 0.0                  # no Big Five questions in the app's demo
text_encoder = "words"        # "tags" (interest tags) or "words" (free-text prompts)

[mix]                         # Stage 5: S = looks_weight * V + (1 - looks_weight) * P
looks_weight = 0.5
chooser_weight = 0.5           # M's weight on the chooser's side; 0.5 = plain harmonic mean

[calibration]                 # Stages 2 and 3: the first 50 profiles and the taste model
n_profiles = 30
n_variety = 12                # profiles 1-20 picked for variety, the rest for uncertainty
n_pairs = 9                    # pair questions ("Who are you more drawn to?"), 2 photos each
pca_dim = 64                  # photo embeddings are shrunk to this many numbers
l2_penalty = 1.0              # keeps the personal correction small until enough swipes
w0_l2_penalty = 10.0          # the same, for fitting the starting taste w_0 on pooled swipes
                              # (both penalties chosen on a separate fake city, seed 101)
group_share_tolerance = 0.05  # looks audit flags a group whose top-30 share is off by more

[lists]                       # Stage 6: the daily list
daily_size = 30
reshow_after_days = 7         # someone passed over can reappear after this many days
policy = "fair"               # "basic" (Sprint 1), "fair" (round-robin with caps) or "nsw"
exposure_multiple = 1.0       # nobody on more than this many times a fair share of lists a day
guarantee_priority = 1.0      # list bonus per missing guaranteed date, divided by weeks left
hide_booked = false           # hide members whose dates plus waiting yeses fill the month
                              # (tested in Sprint 4: it removes options and hurts; off)
nsw_epsilon = 0.1             # Nash social welfare: smaller = stronger push to spread attention
holdback_yeses = 0            # paper 14 hold-back: hide after this many yeses in 7 days (0 = off)
exploration_share = 0.10      # share of slots spent on profiles the model is unsure about

[learning]                    # Stage 8: learning from dates and list choices
months = 3                    # length of the learning simulation
taste_date_weight = 0.5       # a "would meet again" counts as this many swipes in the looks taste
                              # (Sprint 5: 3.0 made looks accuracy worse; 0.5 is neutral)
lambda_date_weight = 3.0      # weight of a date outcome when learning the looks weight
lambda_choice_weight = 0.2    # weight of a list pick or pass when learning the looks weight
lambda_prior_slope = 2.0      # starting belief: both percentiles matter equally, this strongly
lambda_prior_strength = 1.0   # how firmly the looks weight sticks to 0.5 until there is data
lambda_min = 0.2              # learned looks weights are kept inside this range
lambda_max = 0.8

[gate]                        # Ratio gate and guarantee forecast (FR-LM-33, FR-LM-34)
target = 0.90                 # admit men only while forecast fulfilment stays at or above this
min_women_per_man = 3.0       # and active committed women per paying man stays at or above this
min_pool = 10                 # defer applicants with fewer possible matches than this
at_risk_threshold = 0.5       # mid-cycle alert below this chance of reaching the guarantee
forecast_l2 = 1.0             # penalty that keeps the forecast regressions stable
forecast = "delivered"        # the gate's forecast: delivered dates in the real booking flow

[fairness]                    # Exposure and fairness report (FR-LM-23)
min_rate_ratio = 0.8          # flag a group shown or dated at under 80% of the overall rate

[dates]                       # Stage 7: scheduling
guaranteed_per_month_paying = 3
cap_per_month = 3             # nobody gets more dates than this in a month
cap_per_month_free = 3        # monthly cap for members who don't pay (business decision)
free_cap_genders = ["man", "woman", "nonbinary"]  # who the free-member cap applies to
weeks_per_month = 4
max_per_week = 1              # one date per person per week (only 1 is supported for now)
date_value = 1.0              # value of arranging any date, added to every pair's score,
                              # so the scheduler never skips a date it could book
late_month_bonus = 1.0        # urgency: extra edge weight per missing guaranteed date,
                              # divided by the weeks left in the month

[simulation]                  # Acceptance checks run on fake members only
seed = 7
guarantee_target = 0.95       # share of paying members who must reach their guarantee
min_pool_for_guarantee = 10   # paying members with fewer possible matches are reported apart
open_app_rate = 0.6           # chance a member opens the app on a given day
picks_per_day = 3             # most profiles a chooser picks in one day
personality_signal = 0.5      # how closely true fit follows the measured personality score
                              # (paper 9: traits measured before meeting predict it weakly)
like_threshold = 1.0          # true appeal, in standard deviations, where a chooser is 50/50
accept_threshold = 0.0        # the same, for accepting a pick
again_threshold = 0.5         # the same, for wanting a second date after meeting
choice_temperature = 0.5      # lower = more decisive choices
show_up_rate = 0.92           # chance each person shows up to a booked date
meeting_noise = 0.5           # how much meeting in person changes appeal (standard deviations)
rating_cutoffs = [-1.0, -0.25, 0.5, 1.25]  # appeal after meeting where a 1-5 rating steps up
repeat_pick_factor = 0.5      # each earlier pass halves the chance of picking that person later
swipe_threshold = 0.5         # true looks appeal where a calibration swipe is 50/50
training_swipes = 50          # random swipes per member used to fit the starting taste w_0

[booking]                     # Proposed date windows and the payment hold (FR-LM-37)
lead_days = 1                 # earliest window: this many days ahead (no same-day dates)
horizon_days = 14             # windows are looked for this many days ahead (at most 21)
hold_minutes = 15             # both $10 payments must arrive within this many minutes

[billing]                     # Cycles, delivered dates, credits and date fees (FR-LM-38)
price_per_cycle = 200.0       # dollars per billing cycle for a paying member
trial_days = 30               # free trial before the first paid cycle
cycle_days = 28               # length of one billing cycle
date_fee = 10.0               # each person pays this at booking
full_refund_hours = 24        # cancelling at least this many hours ahead refunds the fee in full
late_refund_share = 0.5       # share refunded for a later cancellation; nothing for a no-show
own_absence_counts = true     # his own late cancellation or no-show counts as delivered (D17)

[trust]                       # Private ratings and the trust score (FR-LM-39)
prior_mean = 0.8              # trust of a member with no ratings yet (0 to 1)
prior_strength = 5.0          # the prior counts as this many ratings
reliability_weight = 0.3      # share of trust from showing up and not cancelling late
flag_below = 0.55             # conduct below this, with enough ratings, flags for review
flag_min_ratings = 3          # ratings needed before anyone can be flagged
ranking_weight = 0.5          # how strongly low trust lowers a member's list scores

[cycle_simulation]            # Day-by-day simulation of the real booking flow (FR-LM-42)
cycles = 3                    # billing cycles simulated per paying member
stagger = true                # cycles start on different days (false: all on launch day)
pay_in_time_chooser = 0.97    # chance she pays within the hold after choosing
pay_in_time_chosen = 0.90     # chance he pays within the hold
cancel_rate = 0.05            # chance each person cancels a confirmed date
late_cancel_share = 0.4       # share of cancellations made less than 24 hours ahead
event_rate = 0.10             # event connections per paying member per cycle
new_women_per_cycle = 0.15    # new women joining each cycle, as a share of those at launch
bad_actor_share = 0.05        # members whose conduct on dates is poor
bad_actor_conduct = -3.5      # their conduct, in standard deviations
rating_center = 4.2           # average conduct rating for an average member (1 to 5)
conduct_effect = 0.6          # rating points per standard deviation of conduct
rating_noise = 0.7            # rating points of noise per rating
rating_halo = 0.1             # rating points per standard deviation of attraction (rater bias)

