[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "lastfirstdate-matching"
version = "0.11.0"
description = "Matching engine for lastfirstdate: mutual 50/50 looks and personality matching with fair daily lists and date scheduling."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",  # the public package index refuses this: never publish
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "ortools>=9.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "maturin>=1.9,<2.0"]

# The Python package lives in src/; the Rust core (rust/) is compiled into
# lastfirstdate._core when the package is installed (D16).
[tool.maturin]
manifest-path = "rust/lastfirstdate-py/Cargo.toml"
python-source = "src"
module-name = "lastfirstdate._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
